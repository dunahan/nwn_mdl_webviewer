name: Update cleanmodels WASM

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  # 1. Nightly check — every day at 03:00 UTC
  schedule:
    - cron: '0 3 * * *'

  # 2. Manually triggerable (with optional force flag)
  workflow_dispatch:
    inputs:
      force:
        description: 'Replace WASM even if the version is the same'
        required: false
        default: false
        type: boolean

  # 3. Callable from other workflows (e.g. release.yml)
  workflow_call:
    inputs:
      force:
        description: 'Replace WASM even if the version is the same'
        required: false
        default: false
        type: boolean
    outputs:
      updated:
        description: 'true if a new version was deployed'
        value: ${{ jobs.update-wasm.outputs.updated }}
      tag:
        description: 'Deployed upstream tag'
        value: ${{ jobs.update-wasm.outputs.tag }}

  # 4. Automatically on local release (ensures that the release
  #    always contains the latest WASM version)
  release:
    types: [published]

# ── Permissions ───────────────────────────────────────────────────────────
permissions:
  contents: write   # for the commit

# ── Job ──────────────────────────────────────────────────────────────────────
jobs:
  update-wasm:
    outputs:
      updated: ${{ steps.check.outputs.update }}
      tag:     ${{ steps.upstream.outputs.tag }}
    runs-on: ubuntu-latest
    env:
      UPSTREAM: plenarius/cleanmodels
      WASM_PATH: wasm/cleanmodels.wasm
      B64_PATH:  js/cleanmodels_wasm.js

    steps:

      # ── 1. Repo checkout ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ── 2. Determine latest upstream release ───────────────────────
      #    Upstream provides the WASM as a ZIP archive. We first search
      #    for a ZIP asset with "wasm" in its name, and fallback to a
      #    direct cleanmodels.wasm (in case upstream changes the format
      #    in a future release).
      - name: Fetch upstream release info
        id: upstream
        run: |
          # /releases (nicht /releases/latest) damit auch Pre-Releases (RC) gefunden werden.
          # Der Auth-Header gibt dem Runner ein eigenes Rate-Limit von 5000 Req/h statt
          # des geteilten unauthentifizierten Limits — verhindert sporadische 403-Fehler.
          RELEASE_JSON=$(curl -sSf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ env.UPSTREAM }}/releases" \
            | jq 'first')

          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')

          # Log all assets for diagnostic purposes
          echo "Available assets in release $TAG:"
          echo "$RELEASE_JSON" | jq -r '.assets[] | "  " + .name + " (" + (.size|tostring) + " bytes)"'

          # Priority 1: ZIP asset with "wasm" in its name
          ZIP_URL=$(echo "$RELEASE_JSON" | jq -r '
            [.assets[] | select(.name | test("wasm.*\\.zip$"; "i"))]
            | first
            | .browser_download_url // empty')

          # Priority 2: direct .wasm file (future fallback)
          WASM_URL=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(.name == "cleanmodels.wasm")
            | .browser_download_url')

          if [ -n "$ZIP_URL" ] && [ "$ZIP_URL" != "null" ]; then
            echo "Asset type: ZIP  →  $ZIP_URL"
            echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
            echo "url=$ZIP_URL"    >> "$GITHUB_OUTPUT"
            echo "asset_type=zip"  >> "$GITHUB_OUTPUT"
          elif [ -n "$WASM_URL" ] && [ "$WASM_URL" != "null" ]; then
            echo "Asset type: direct WASM  →  $WASM_URL"
            echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
            echo "url=$WASM_URL"    >> "$GITHUB_OUTPUT"
            echo "asset_type=wasm"  >> "$GITHUB_OUTPUT"
          else
            echo "::error::No WASM asset (ZIP or .wasm) found in release $TAG."
            exit 1
          fi

      # ── 3. Check current local version ──────────────────────────────
      #    We store the tag in wasm/cleanmodels.version (single line)
      - name: Check local version
        id: check
        run: |
          VERSION_FILE="wasm/cleanmodels.version"
          LOCAL_TAG="(none)"
          if [ -f "$VERSION_FILE" ]; then
            LOCAL_TAG=$(cat "$VERSION_FILE")
          fi

          UPSTREAM_TAG="${{ steps.upstream.outputs.tag }}"
          FORCE="${{ github.event.inputs.force }}"

          echo "Local: $LOCAL_TAG  |  Upstream: $UPSTREAM_TAG  |  Force: $FORCE"

          if [ "$LOCAL_TAG" = "$UPSTREAM_TAG" ] && [ "$FORCE" != "true" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date — no update required."
          else
            echo "update=true"  >> "$GITHUB_OUTPUT"
            echo "Performing update: $LOCAL_TAG → $UPSTREAM_TAG"
          fi

      # ── 4a. Download asset (ZIP) ───────────────────────────────────
      - name: Download and extract ZIP
        if: >
          steps.check.outputs.update == 'true' &&
          steps.upstream.outputs.asset_type == 'zip'
        run: |
          mkdir -p wasm tmp_zip

          echo "Downloading ZIP..."
          curl -sSfL "${{ steps.upstream.outputs.url }}" -o tmp_zip/upstream.zip

          echo "ZIP contents:"
          unzip -l tmp_zip/upstream.zip

          # Extract cleanmodels.wasm from ZIP — regardless of the subfolder
          WASM_IN_ZIP=$(unzip -l tmp_zip/upstream.zip | grep -o '[^ ]*cleanmodels\.wasm' | head -1)

          if [ -z "$WASM_IN_ZIP" ]; then
            echo "::error::cleanmodels.wasm not found in ZIP."
            echo "ZIP contents:"
            unzip -l tmp_zip/upstream.zip
            exit 1
          fi

          echo "Extracting: $WASM_IN_ZIP"
          unzip -jo tmp_zip/upstream.zip "$WASM_IN_ZIP" -d wasm/
          rm -rf tmp_zip

          SIZE=$(wc -c < "${{ env.WASM_PATH }}")
          echo "Extracted: ${{ env.WASM_PATH }} ($SIZE bytes)"

          # Update version file
          echo "${{ steps.upstream.outputs.tag }}" > wasm/cleanmodels.version

      # ── 4b. Download asset (direct WASM) ──────────────────────────
      - name: Download direct WASM
        if: >
          steps.check.outputs.update == 'true' &&
          steps.upstream.outputs.asset_type == 'wasm'
        run: |
          mkdir -p wasm
          curl -sSfL "${{ steps.upstream.outputs.url }}" -o "${{ env.WASM_PATH }}"

          SIZE=$(wc -c < "${{ env.WASM_PATH }}")
          echo "Downloaded: ${{ env.WASM_PATH }} ($SIZE bytes)"

          echo "${{ steps.upstream.outputs.tag }}" > wasm/cleanmodels.version

      # ── 5. Verify WASM signature ─────────────────────────────────────────
      #    A valid WASM binary always starts with the magic header
      #    0x00 0x61 0x73 0x6D ("\0asm"). If this doesn't match, we caught
      #    the wrong file and must abort.
      - name: Verify WASM magic header
        if: steps.check.outputs.update == 'true'
        run: |
          MAGIC=$(xxd -p -l 4 "${{ env.WASM_PATH }}")
          echo "Magic header: $MAGIC (expected: 0061736d)"
          if [ "$MAGIC" != "0061736d" ]; then
            echo "::error::Invalid WASM header. File is not a valid WebAssembly binary."
            exit 1
          fi
          echo "✅ WASM header is valid."

      # ── 6. Generate Base64-JS for file:// mode ──────────────────────
      - name: Generate cleanmodels_wasm.js
        if: steps.check.outputs.update == 'true'
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          WASM="${{ env.WASM_PATH }}"
          OUT="${{ env.B64_PATH }}"

          mkdir -p js
          B64=$(base64 -w 0 "$WASM")

          cat > "$OUT" << JSEOF
          /* cleanmodels.wasm — Base64 encoded for file:// mode
             Upstream version : ${TAG}
             Generated        : $(date -u '+%Y-%m-%dT%H:%M:%SZ')
             Source           : https://github.com/${{ env.UPSTREAM }}/releases/tag/${TAG}
             WARNING: This file is automatically updated by the GitHub Actions 
             workflow update-wasm.yml. Do not edit manually.
          */
          // eslint-disable-next-line
          var CM_WASM_B64 = "${B64}";
          JSEOF

          SIZE=$(wc -c < "$OUT")
          echo "Generated: $OUT ($SIZE bytes)"

      # ── 7. Save SHA-256 checksum ─────────────────────────────────
      - name: Save SHA-256
        if: steps.check.outputs.update == 'true'
        run: |
          sha256sum "${{ env.WASM_PATH }}" | tee wasm/cleanmodels.wasm.sha256
          echo "SHA-256 saved in wasm/cleanmodels.wasm.sha256."

      # ── 8. Commit changes ─────────────────────────────────────────
      - name: Commit and Push
        if: steps.check.outputs.update == 'true'
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            "${{ env.WASM_PATH }}" \
            "${{ env.B64_PATH }}"  \
            wasm/cleanmodels.version \
            wasm/cleanmodels.wasm.sha256

          git commit -m "chore: cleanmodels WASM → ${TAG}

          Upstream: https://github.com/${{ env.UPSTREAM }}/releases/tag/${TAG}
          SHA-256 : $(cat wasm/cleanmodels.wasm.sha256 | cut -d' ' -f1)
          Trigger : ${{ github.event_name }}"

          git push

      # ── 9. Attach release asset (only for local release event) ───────
      - name: Upload WASM as release asset
        if: >
          steps.check.outputs.update == 'true' &&
          github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.WASM_PATH }}
            ${{ env.B64_PATH }}
            wasm/cleanmodels.wasm.sha256

      # ── 10. Summary ─────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          UPDATED="${{ steps.check.outputs.update }}"
          TYPE="${{ steps.upstream.outputs.asset_type }}"
          {
            echo "## cleanmodels WASM Update"
            echo ""
            if [ "$UPDATED" = "true" ]; then
              echo "✅ **Updated to \`${TAG}\`** (Asset type: ${TYPE})"
              echo ""
              echo "| File | Size |"
              echo "|-------|-------|"
              echo "| \`${{ env.WASM_PATH }}\` | $(wc -c < ${{ env.WASM_PATH }}) bytes |"
              echo "| \`${{ env.B64_PATH }}\` | $(wc -c < ${{ env.B64_PATH }}) bytes |"
              echo ""
              echo "SHA-256: \`$(cat wasm/cleanmodels.wasm.sha256 | cut -d' ' -f1)\`"
            else
              echo "ℹ️ **Already up to date** — no update required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
