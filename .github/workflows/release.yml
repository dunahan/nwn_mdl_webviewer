# ═══════════════════════════════════════════════════════════
#  NWN MDL Viewer — Create GitHub Release
#
#  Workflow:
#    1. update-wasm   → Ensures cleanmodels.wasm is up to date
#    2. release        → Builds standalone HTML + source ZIP and publishes
#
#  Triggers:
#    - Push of a version tag:  git tag v1.2.3 && git push --tags
#    - Manually via the Actions tab (workflow_dispatch)
# ═══════════════════════════════════════════════════════════

name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Job 1: Keep WASM up to date ─────────────────────────────────────────────
  # Invokes update-wasm.yml as a reusable workflow. If there is no new 
  # upstream release, this job terminates in ~10 seconds without a commit.
  update-wasm:
    uses: ./.github/workflows/update-wasm.yml
    permissions:
      contents: write

  # ── Job 2: Build & Release ─────────────────────────────────────────────────
  release:
    needs: update-wasm
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.name }}

    steps:
      # Fresh checkout — important: update-wasm might have pushed a new commit
      # (new WASM version). By using ref: github.ref_name, we always fetch
      # the latest state including any potential WASM updates.
      - name: Checkout (after potential WASM update)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Run build script
        run: python build.py --version "${{ steps.tag.outputs.name }}"

      # WASM version info for the release notes
      - name: Determine WASM version
        id: wasm_ver
        run: |
          VER="(unknown)"
          if [ -f "wasm/cleanmodels.version" ]; then
            VER=$(cat wasm/cleanmodels.version)
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "NWN MDL WebViewer ${{ steps.tag.outputs.name }}"
          body: |
            ## NWN MDL WebViewer ${{ steps.tag.outputs.name }}

            ### Downloads
            | File | Description |
            |---|---|
            | `nwn_mdl_webviewer.html` | **Standalone Version** — simply open in your browser, no server required |
            | `nwn-mdl-webviewer-src.zip` | Complete source code (HTML + CSS + JS + WASM + lang/ + themes/ + docs/) |

            ### Usage
            1. Download `nwn_mdl_webviewer.html`
            2. Open it in your browser (Chrome, Firefox, Edge)
            3. Drag and drop `.mdl` + texture files (`.tga`, `.dds`) into the drop zone

            ### Supported Formats
            - ASCII MDL (decompiled with NWN Explorer or similar)
            - Binary MDL (automatically decompiled via cleanmodels WASM)
            - NWN/Bioware DDS (20-byte header, DXT1/DXT5)
            - Standard DDS (ATI1/BC4, ATI2/BC5, DXT1/DXT3/DXT5) — NWN:EE Normal/Specular Maps
            - MTR material files (Normal Mapping, Specular, Roughness, PBR parameters)
            - TGA (Type 2/10, 16/24/32-bit)
            - PLT (BioWare Palette Texture)

            ### Components
            | Component | Version |
            |---|---|
            | cleanmodels WASM | `${{ steps.wasm_ver.outputs.version }}` |
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: |
            dist/nwn_mdl_webviewer.html
            dist/nwn-mdl-webviewer-src.zip

  # ── Job 3: Deploy to GitHub Pages ──────────────────────────────────────────
  # Ruft pages.yml als reusable workflow auf und übergibt die bekannte Version.
  # So landet immer die korrekte Versionsnummer auch auf GitHub Pages.
  deploy-pages:
    needs: release
    uses: ./.github/workflows/pages.yml
    with:
      version: ${{ needs.release.outputs.tag_name }}
    permissions:
      pages: write
      id-token: write
