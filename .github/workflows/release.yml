# ═══════════════════════════════════════════════════════════
#  NWN MDL Viewer — Create GitHub Release
#
#  Ablauf:
#    1. update-wasm   → stellt sicher dass cleanmodels.wasm aktuell ist
#    2. release        → baut Standalone-HTML + Source-ZIP und veröffentlicht
#
#  Auslöser:
#    - Push eines Version-Tags:  git tag v1.2.3 && git push --tags
#    - Manuell über den Actions-Tab (workflow_dispatch)
# ═══════════════════════════════════════════════════════════

name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Job 1: WASM aktuell halten ─────────────────────────────────────────────
  # Ruft update-wasm.yml als reusable workflow auf. Wenn upstream kein neues
  # Release hat, beendet sich dieser Job in ~10 Sekunden ohne Commit.
  update-wasm:
    uses: ./.github/workflows/update-wasm.yml
    permissions:
      contents: write

  # ── Job 2: Build & Release ─────────────────────────────────────────────────
  release:
    needs: update-wasm   # wartet bis update-wasm abgeschlossen ist
    runs-on: ubuntu-latest

    steps:
      # Frischer Checkout — wichtig: update-wasm könnte einen neuen Commit
      # gepusht haben (neue WASM-Version). Mit ref: main/master holen wir
      # immer den neuesten Stand inklusive etwaiger WASM-Updates.
      - name: Checkout (nach möglichem WASM-Update)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run build script
        run: python build.py

      - name: Rename dist file for release
        run: cp dist/index.html dist/nwn_mdl_webviewer.html

      # Source-ZIP: jetzt mit wasm/ und scripts/ Verzeichnissen
      - name: Create source ZIP
        run: |
          zip -r dist/nwn-mdl-webviewer-src.zip \
            css/ \
            js/ \
            lang/ \
            wasm/ \
            scripts/ \
            index.html \
            build.py

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # WASM-Versionsinfo für die Release-Notes
      - name: WASM-Version ermitteln
        id: wasm_ver
        run: |
          VER="(unbekannt)"
          if [ -f "wasm/cleanmodels.version" ]; then
            VER=$(cat wasm/cleanmodels.version)
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "NWN MDL WebViewer ${{ steps.tag.outputs.name }}"
          body: |
            ## NWN MDL WebViewer ${{ steps.tag.outputs.name }}

            ### Downloads
            | Datei | Beschreibung |
            |---|---|
            | `nwn_mdl_webviewer.html` | **Standalone-Version** — einfach im Browser öffnen, kein Server nötig |
            | `nwn-mdl-webviewer-src.zip` | Vollständiger Quellcode (HTML + CSS + JS + WASM + lang/) |

            ### Verwendung
            1. `nwn_mdl_webviewer.html` herunterladen
            2. Im Browser öffnen (Chrome, Firefox, Edge)
            3. `.mdl` + Texturdateien (`.tga`, `.dds`) in die Drop-Zone ziehen

            ### Unterstützte Formate
            - ASCII MDL (dekompiliert mit NWN Explorer o.ä.)
            - Binäres MDL (wird automatisch via cleanmodels WASM dekompiliert)
            - NWN/Bioware DDS (20-Byte-Header, DXT1/DXT5)
            - TGA (Type 2/10, 16/24/32-bit)
            - PLT (BioWare Palette Texture)

            ### Komponenten
            | Komponente | Version |
            |---|---|
            | cleanmodels WASM | `${{ steps.wasm_ver.outputs.version }}` |
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: |
            dist/nwn_mdl_webviewer.html
            dist/nwn-mdl-webviewer-src.zip
